<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- TilePulse tab icon: a 4-lane board with pixel tiles falling, in the game's colours -->
  <rect width="16" height="16" fill="#211F2B"/>
  <!-- highlight hit line -->
  <rect y="14" width="16" height="1" fill="#C2B5B0" opacity=".55"/>
  <!-- lane 1: tap tile (light top/left, dark bottom/right bevel) -->
  <rect x="4" y="1" width="4" height="5" fill="#9890AD"/>
  <rect x="4" y="1" width="4" height="1" fill="#B2A9C8"/>
  <rect x="4" y="1" width="1" height="5" fill="#B2A9C8"/>
  <rect x="7" y="2" width="1" height="4" fill="#5C586C"/>
  <rect x="5" y="5" width="3" height="1" fill="#5C586C"/>
  <!-- lane 0: tap tile -->
  <rect x="0" y="7" width="4" height="5" fill="#9890AD"/>
  <rect x="0" y="7" width="4" height="1" fill="#B2A9C8"/>
  <rect x="0" y="7" width="1" height="5" fill="#B2A9C8"/>
  <rect x="3" y="8" width="1" height="4" fill="#5C586C"/>
  <rect x="1" y="11" width="3" height="1" fill="#5C586C"/>
  <!-- lane 2: tap tile -->
  <rect x="8" y="4" width="4" height="5" fill="#9890AD"/>
  <rect x="8" y="4" width="4" height="1" fill="#B2A9C8"/>
  <rect x="8" y="4" width="1" height="5" fill="#B2A9C8"/>
  <rect x="11" y="5" width="1" height="4" fill="#5C586C"/>
  <rect x="9" y="8" width="3" height="1" fill="#5C586C"/>
  <!-- lane 3: coral tile landing on the hit line -->
  <rect x="12" y="9" width="4" height="5" fill="#C2B5B0"/>
  <rect x="12" y="9" width="4" height="1" fill="#EAE6F0"/>
  <rect x="12" y="9" width="1" height="5" fill="#EAE6F0"/>
  <rect x="15" y="10" width="1" height="4" fill="#77728E"/>
  <rect x="13" y="13" width="3" height="1" fill="#77728E"/>
</svg>
